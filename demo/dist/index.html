<style>
  :root {
    --wall: #cfc8ba;                   /* one flat color everywhere */
    --chrome: rgba(25, 22, 18, .62);   /* header/hint/controls glass */
    --ink: #f2eee4;
    --ink-dim: rgba(242, 238, 228, .55);
    --note: #4a443a;                   /* text sitting directly on the wall */
    --mat: #fbfaf6;                    /* frame mat */
    --cap: #776f63;                    /* caption text on the mat */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --wall: #26231e;
      --chrome: rgba(12, 11, 9, .66);
      --ink: #e8e4d8;
      --ink-dim: rgba(232, 228, 216, .5);
      --note: #d5cfc2;
      --mat: #c7bfab;                  /* warm off-white, not pure white */
      --cap: #4c4637;
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body {
    background:var(--wall);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    -webkit-user-select:none; user-select:none;
    overscroll-behavior:none;

  #stage {
    position:fixed; inset:0;
    touch-action:none;               /* we handle pan/zoom, not the browser */
    cursor:grab;
    /* vignette baked into the stage background: the scene falls off into
       shadow toward the viewport edges, so it feels like the wall simply
       ends - nothing continues past it. Viewport-anchored (stage is never
       transformed). */
    background-color: var(--wall);
    background-image: radial-gradient(125% 125% at 50% 50%,
      rgba(0,0,0,0) 58%, rgba(0,0,0,.32) 100%);
  }
  #stage.dragging { cursor:grabbing; }

  #world { position:absolute; left:0; top:0; transform-origin:0 0; }

  #wall {
    position:relative;
    width:6792px; height:6965px;
    /* transparent: the stage background (with its vignette) shows through
       everywhere, frames float directly on it */
    background: transparent;
  }

  .item { position:absolute; left:0; top:0; }
  .frame {
    background:var(--mat);
    padding:20px;
    border-radius:2px;                  /* soft corners on the mat */
    box-shadow: 0 2px 3px rgba(0,0,0,.16), 0 9px 20px rgba(0,0,0,.20);
  }
  /* photo box: exact image rectangle, clips the placeholder so any blur
     stays strictly inside the photo and never touches the mat */
  .pbox {
    position:relative;
    overflow:hidden;
    border-radius:2px;                  /* soft corners on the photo itself */
    background:#000;
  }
  .pbox .pbg {
    position:absolute; inset:0;
    background-size:cover; background-position:center;
    filter:blur(12px);
    transform:scale(1.08);              /* hide the blurred edge rim */
    transition:opacity .4s ease;
  }
  .pbox.loaded .pbg { opacity:0; }      /* fade out once the photo decodes */
  .pbox img {
    display:block;
    width:100%; height:100%;            /* box ratio == photo aspect, exact */
    border-radius:2px;
    -webkit-user-drag:none; user-drag:none;
  }
  .frame .cap {
    width:100%; height:56px;
    padding-top:22px;   /* air between photo and text */
    color:var(--cap);
    overflow:hidden;
    /* 22px air above + 22px (2px strip + 20px mat) below centers the text */
  }
  .frame .cap-line {
    height:16px; line-height:16px;   /* two 16px lines fit the strip */
    font-size:11px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .frame .cap-line:empty { display:none; }
  .item.off { display:none; }

  /* light mats cast a deeper shadow on the dark wall */
  @media (prefers-color-scheme: dark) {
    .frame { box-shadow: 0 2px 4px rgba(0,0,0,.45), 0 12px 28px rgba(0,0,0,.5); }
  }

  /* chrome: header + controls */
  header {
    position:fixed; top:0; left:0; right:0;
    display:flex; align-items:baseline; gap:14px;
    padding:14px 18px; pointer-events:none;
    background:linear-gradient(180deg, var(--chrome), rgba(0,0,0,0));
  }
  header h1 { font-size:13px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; }
  header .count { font-size:11px; color:var(--ink-dim); }

  /* the hint sits on the same line as the credit and the controls and wears the
     same pill, so the three read as one band */
  #hint {
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
    font-size:11px; color:var(--ink-dim); text-align:center; pointer-events:none;
    white-space:nowrap;
    background:var(--chrome); border:1px solid rgba(255,255,255,.12);
    padding:7px 11px; border-radius:8px; backdrop-filter:blur(4px);
    opacity:1; transition:opacity 1.2s ease 6s;
  }
  #hint.gone { opacity:0; }
  /* no manual on touch, and no room for it beside the controls on a narrow window */
  @media (pointer: coarse), (max-width: 840px) { #hint { display:none; } }

  #controls {
    position:fixed; right:14px; bottom:14px;
    display:flex; gap:6px; align-items:center;
    background:var(--chrome); border:1px solid rgba(255,255,255,.12);
    padding:6px; border-radius:10px;
    backdrop-filter:blur(4px);
  }
  #controls button {
    width:34px; height:34px; border:0; border-radius:7px;
    background:transparent; color:var(--ink);
    font:inherit; font-size:17px; line-height:1; cursor:pointer;
  }
  #controls button:hover { background:rgba(255,255,255,.14); }
  #controls button:active { background:rgba(255,255,255,.24); }
  #controls .sep { width:1px; height:20px; background:rgba(255,255,255,.18); margin:0 2px; }
  #zoomLbl { min-width:38px; text-align:center; font-size:11px; color:var(--ink-dim); }

  .empty-note {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:0 24px;
  }
  .empty-note p { max-width:420px; font-size:13px; line-height:1.7; color:var(--note); }
  .empty-note code {
    color:var(--note); background:rgba(127,127,127,.2); padding:1px 6px; border-radius:4px;
  }

  /* chrome: the locate mark on the fit button */
  #controls button svg { width:17px; height:17px; display:block; margin:0 auto; }

  /* bottom left: where the wall came from */
  #credit {
    position:fixed; left:14px; bottom:14px;
    display:inline-flex; align-items:center; gap:5px;
    font-size:11px; color:var(--ink-dim); text-decoration:none;
    background:var(--chrome); border:1px solid rgba(255,255,255,.12);
    padding:7px 11px; border-radius:8px; backdrop-filter:blur(4px);
  }
  #credit:hover { color:var(--ink); border-color:rgba(255,255,255,.24); }
  #credit b { font-weight:600; color:var(--ink); }

  /* top right: the photographer */
  #authorBtn {
    position:fixed; right:14px; top:14px; z-index:2;
    display:inline-flex; align-items:center; gap:7px;
    font:inherit; font-size:11px; letter-spacing:.08em; text-transform:uppercase;

    background:var(--chrome); border:1px solid rgba(255,255,255,.12);

  }
  #authorBtn:hover { background:rgba(255,255,255,.14); }
  #authorBtn svg { width:15px; height:15px; display:block; }
  #authorBtn[hidden], #credit[hidden] { display:none; }

  #authorCard {
    position:fixed; right:14px; top:56px; z-index:3;
    width:min(300px, calc(100vw - 28px));
    background:var(--chrome); border:1px solid rgba(255,255,255,.14);
    border-radius:10px; padding:15px 16px 16px;
    backdrop-filter:blur(6px);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    color:var(--ink); font-size:12px; line-height:1.6;
  }
  #authorCard h2 { font-size:13px; letter-spacing:.02em; padding-right:22px; }
  #authorCard .author-role { color:var(--ink-dim); font-size:11px; margin-top:2px; }
  #authorCard .author-bio { margin-top:9px; }
  #authorCard .author-facts {
    margin-top:10px; display:grid; gap:2px; font-size:11px;
  }
  #authorCard .author-facts dt { color:var(--ink-dim); margin-top:7px; }
  #authorCard .author-facts dd { margin:0; overflow-wrap:anywhere; }
  #authorCard a { color:var(--ink); text-decoration:none; border-bottom:1px solid rgba(255,255,255,.3); }
  #authorCard a:hover { border-bottom-color:var(--ink); }
  #authorCard .author-close {

    background:transparent; color:var(--ink-dim);
    font:inherit; font-size:15px; line-height:1; cursor:pointer;
  }
  #authorCard .author-close:hover { background:rgba(255,255,255,.14); color:var(--ink); }

  /* a phone: the author button keeps its mark, drops its word */
  @media (max-width: 460px) {
    #authorBtn { padding:8px; }
    #authorBtn span { display:none; }
  }
</style>

var MAX_SCALE = 4;
// vertical world window shown on load, independent of wall size

var stage = document.getElementById('stage');
var world = document.getElementById('world');
var wall = document.getElementById('wall');
var hint = document.getElementById('hint');
var zoomLbl = document.getElementById('zoomLbl');

var MAT = 20;
var CAP_H = 56;
var items = [];
for (var i = 0; i < POS.length; i++) {
  var d = POS[i];
  var el = document.createElement('div');
  el.className = 'item';
  el.style.transform = 'translate(' + d.x + 'px,' + d.y + 'px)';

  var frame = document.createElement('div');
  frame.className = 'frame';
  frame.style.width = (d.pw + 2 * MAT) + 'px';
  // height auto: image (d.ph) + caption strip (CAP_H)

  var img = document.createElement('img');
  img.src = 'photos/' + d.file;
  // the alt the build worked out (sidecar text, or the facts about the shot)
  img.alt = d.alt || d.base.replace(/-/g, ' ');
  img.width = d.pw;              // sane, layout-accurate numbers
  img.height = d.ph;
  img.loading = 'lazy';
  img.decoding = 'async';
  img.draggable = false;

  // photo box: exact image rectangle; clips the blurred placeholder so the
  // blur never bleeds past the photo onto the mat
  var pbox = document.createElement('div');
  pbox.className = 'pbox';
  pbox.style.width = d.pw + 'px';
  pbox.style.height = d.ph + 'px';
  if (d.thumb) {
    var pbg = document.createElement('div');
    pbg.className = 'pbg';
    pbg.style.backgroundImage = 'url("' + d.thumb + '")';
    pbox.appendChild(pbg);
  }
  pbox.appendChild(img);
  frame.appendChild(pbox);

  var cap = document.createElement('div');
  cap.className = 'cap';
  var lines = [d.spec, d.cam]; // filename line hidden for now
  for (var k = 0; k < lines.length; k++) {
    var cl = document.createElement('div');
    cl.className = 'cap-line';
    cl.textContent = lines[k];
    if (lines[k]) cl.title = lines[k];
    cap.appendChild(cl);
  }
  frame.appendChild(cap);
  el.appendChild(frame);
  wall.appendChild(el);
  items.push({ el: el, x: d.x, y: d.y, w: d.pw + 2 * MAT, h: d.ph + CAP_H + 2 * MAT });
}

// the wall the build actually produced, not a number baked into this file
var wallW = 6792, wallH = 6965;

// mark a photo box as loaded the moment its image decodes (capturing phase
// catches every load, even ones that slip past per-element listeners)
document.addEventListener('load', function (e) {
  var t = e.target;
  if (t && t.tagName === 'IMG' && t.closest && t.closest('.pbox')) {
    t.closest('.pbox').classList.add('loaded');
  }
}, true);

// view state: screen = world * scale + (tx, ty)
var tx = 0, ty = 0, scale = 1;

function setTransform() {
  world.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
  if (zoomLbl) zoomLbl.textContent = Math.round(scale * 100) + '%';
}

function fitScale() {
  var vw = stage.clientWidth, vh = stage.clientHeight;
  return Math.min((vw - 32) / wallW, (vh - 32) / wallH);
}

function minScale() {
  return Math.max(fitScale(), 0.03); // smallest zoom = whole wall visible
}

// pan stops at the wall edges: no empty-space roaming. When the wall is
// smaller than the viewport on an axis, it is centered and locked there.
function clamp() {
  var vw = stage.clientWidth, vh = stage.clientHeight;
  var w = wallW * scale, h = wallH * scale;

  if (w < vw - 1) { tx = Math.round((vw - w) / 2); }
  else { tx = Math.min(0, Math.max(vw - w, tx)); }
  if (h < vh - 1) { ty = Math.round((vh - h) / 2); }
  else { ty = Math.min(0, Math.max(vh - h, ty)); }
}

function fit() {
  scale = Math.min(fitScale(), MAX_SCALE);
  if (scale < minScale()) scale = minScale();
  tx = 0; ty = 0;
  clamp();
  setTransform();
}

function zoomAt(cx, cy, factor) {
  var ns = scale * factor;
  if (ns > MAX_SCALE) ns = MAX_SCALE;
  if (ns < minScale()) ns = minScale(); // land exactly on the fit minimum
  var wx = (cx - tx) / scale, wy = (cy - ty) / scale; // point under cursor in world
  scale = ns;
  tx = cx - wx * scale;
  ty = cy - wy * scale;
  clamp();
  setTransform();
}

function toWorld(cx, cy) { return [(cx - tx) / scale, (cy - ty) / scale]; }

/* ---------- culling: hide frames outside the viewport ---------- */
var rafPending = false;
function scheduleCull() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(function () {
    rafPending = false;
    var x0 = -tx / scale - 200, y0 = -ty / scale - 200;
    var x1 = x0 + stage.clientWidth / scale + 400;
    var y1 = y0 + stage.clientHeight / scale + 400;
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var off = it.x + it.w < x0 || it.x > x1 || it.y + it.h < y0 || it.y > y1;
      if (off && !it.el.classList.contains('off')) it.el.classList.add('off');
      else if (!off) {
        if (it.el.classList.contains('off')) it.el.classList.remove('off');
        var pbi = it.el.querySelector('.pbox');
        if (pbi && !pbi.classList.contains('loaded')) {
          var imi = it.el.querySelector('img');
          if (imi.complete && imi.naturalWidth > 0) pbi.classList.add('loaded');
        }
      }
    }
  });
}

/* ---------- drag to pan (pointer events, also pinch) ---------- */
var pointers = {}; // pointerId -> {x,y}
var dragStart = null;   // {sx,sy,tx,ty}
var pinch = null;      // {lastDist, midX, midY} - incremental pinch state
var moved = false;

stage.addEventListener('pointerdown', function (e) {
  cancelGlide();                       // grabbing stops any inertia
  lastMoveT = 0;
  world.style.transition = ''; // key-move glide must not fight a drag
  try { stage.setPointerCapture(e.pointerId); } catch (err) { /* synthetic/test events */ }
  pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
  var ids = Object.keys(pointers);
  if (ids.length === 2) {
    dragStart = null;
    pinch = null; // first two-finger move (re)initializes the pinch state
  } else {
    dragStart = { sx: e.clientX, sy: e.clientY, tx: tx, ty: ty };
    pinch = null;
  }
  moved = false;
});

stage.addEventListener('pointermove', function (e) {
  if (!pointers[e.pointerId]) return;
  var p = pointers[e.pointerId];
  var dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (Math.abs(e.clientX - (dragStart ? dragStart.sx : e.clientX)) > 3 ||
      Math.abs(e.clientY - (dragStart ? dragStart.sy : e.clientY)) > 3) moved = true;

  var ids = Object.keys(pointers);
  if (ids.length === 2) {
    var a = pointers[ids[0]], b = pointers[ids[1]];
    var dist = Math.hypot(a.x - b.x, a.y - b.y);
    if (dist < 8) return;
    var cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    if (!pinch) {
      pinch = { lastDist: dist, midX: cx, midY: cy };
    }
    // follow the fingers: first translate by the midpoint delta, then zoom
    // anchored at the midpoint - no stale-anchor drift
    tx += cx - pinch.midX;
    ty += cy - pinch.midY;
    var ns = scale * (dist / pinch.lastDist);
    if (ns > MAX_SCALE) ns = MAX_SCALE;
    if (ns < minScale()) ns = minScale();
    var wx = (cx - tx) / scale, wy = (cy - ty) / scale;
    scale = ns;
    tx = cx - wx * scale;
    ty = cy - wy * scale;
    pinch.lastDist = dist; pinch.midX = cx; pinch.midY = cy;
    clamp(); setTransform(); scheduleCull();
    return;
  }
  if (ids.length === 1) {
    if (!dragStart) dragStart = { sx: e.clientX, sy: e.clientY, tx: tx, ty: ty };
    stage.classList.add('dragging');
    tx = dragStart.tx + (e.clientX - dragStart.sx);
    ty = dragStart.ty + (e.clientY - dragStart.sy);
    // velocity estimate (px/ms, exponential smoothing) for the glide
    var now = performance.now();
    if (lastMoveT) {
      var dtm = Math.max(8, now - lastMoveT);
      var ivx = (e.clientX - prevMoveX) / dtm;
      var ivy = (e.clientY - prevMoveY) / dtm;
      velX = velX * 0.65 + ivx * 0.35;
      velY = velY * 0.65 + ivy * 0.35;
    }
    prevMoveX = e.clientX; prevMoveY = e.clientY; lastMoveT = now;
    clamp(); setTransform(); scheduleCull();
  }
});

function endPointer(e) {
  delete pointers[e.pointerId];
  var n = Object.keys(pointers).length;
  if (n < 2) pinch = null;      // pinch needs exactly two fingers
  if (n === 0) {
    dragStart = null;
    stage.classList.remove('dragging');
  }
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);

/* ---------- inertia: iOS-like glide after a flick ---------- */
var glideRaf = 0, velX = 0, velY = 0, lastMoveT = 0, prevMoveX = 0, prevMoveY = 0;

function cancelGlide() {
  if (glideRaf) { cancelAnimationFrame(glideRaf); glideRaf = 0; }
  velX = velY = 0; lastMoveT = 0;
}

function startGlide() {
  if (glideRaf) { cancelAnimationFrame(glideRaf); glideRaf = 0; }
  if (Math.abs(velX) < 0.03 && Math.abs(velY) < 0.03) return; // not a flick
  var last = performance.now();
  function step(now) {
    var dt = Math.min(32, now - last);
    last = now;
    var damp = Math.pow(0.93, dt / 16);  // exponential friction
    velX *= damp; velY *= damp;
    var bx = tx, by = ty;
    tx += velX * dt;
    ty += velY * dt;
    clamp();
    if (Math.abs(tx - bx) < 0.05) velX = 0; // hit the wall edge on x
    if (Math.abs(ty - by) < 0.05) velY = 0; // ...or on y
    setTransform();
    scheduleCull();
    if (Math.abs(velX) < 0.02 && Math.abs(velY) < 0.02) { glideRaf = 0; return; }
    glideRaf = requestAnimationFrame(step);
  }
  glideRaf = requestAnimationFrame(step);
}

/* ---------- double-tap / double-click zooms in ---------- */
var lastTap = 0, tapX = 0, tapY = 0;
stage.addEventListener('pointerup', function (e) {
  if (moved) { startGlide(); moved = false; return; }
  var now = Date.now();
  if (now - lastTap < 350 && Math.hypot(e.clientX - tapX, e.clientY - tapY) < 40) {
    zoomAt(e.clientX, e.clientY, 2.2);
    scheduleCull();
    lastTap = 0;
  } else {
    lastTap = now; tapX = e.clientX; tapY = e.clientY;
  }
});

/* ---------- wheel zoom (to cursor) ---------- */
stage.addEventListener('wheel', function (e) {
  cancelGlide();
  e.preventDefault();
  var f = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.03 : 0.0016));
  zoomAt(e.clientX, e.clientY, f);
  scheduleCull();
}, { passive: false });

/* ---------- native gesture suppression (iOS) ---------- */
// the wall owns all touches: stop Safari's pinch-zoom, double-tap zoom and
// rubber-band scrolling from fighting our pointer-event pan/zoom
document.addEventListener('touchmove', function (e) {
  if (e.target === stage || stage.contains(e.target)) e.preventDefault();
}, { passive: false });
['gesturestart', 'gesturechange', 'gestureend'].forEach(function (name) {
  document.addEventListener(name, function (e) {
    if (e.target === stage || stage.contains(e.target)) e.preventDefault();
  });
});

/* ---------- keyboard panning (arrow keys) ---------- */
var keyT = null;
function moveBy(dx, dy) {
  tx += dx; ty += dy;
  clamp();
  world.style.transition = 'transform 0.18s ease'; // soft glide for key moves
  setTransform();
  clearTimeout(keyT);
  keyT = setTimeout(function () { world.style.transition = ''; }, 220);
}
window.addEventListener('keydown', function (e) {
  // + / = zoom in, - zoom out (around the viewport center)
  if (e.key === '+' || e.key === '=' || e.key === '-') {
    e.preventDefault();
    var dir = (e.key === '-') ? (1 / 1.5) : 1.5;
    zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, dir);
    scheduleCull();
    return;
  }
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight' &&
      e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  var vw = stage.clientWidth, vh = stage.clientHeight;
  // arrow = look in that direction: Right reveals content to the right, so
  // the wall shifts left (negative tx), Down shifts up (negative ty)
  var dx = e.key === 'ArrowRight' ? -Math.round(vw * 0.55) : e.key === 'ArrowLeft' ? Math.round(vw * 0.55) : 0;
  var dy = e.key === 'ArrowDown' ? -Math.round(vh * 0.55) : e.key === 'ArrowUp' ? Math.round(vh * 0.55) : 0;
  moveBy(dx, dy);
  scheduleCull();
});

/* ---------- controls ---------- */
var zoomIn = document.getElementById('zoomIn');
var zoomOut = document.getElementById('zoomOut');
var fitBtn = document.getElementById('fitBtn');
zoomIn.addEventListener('click', function () {
  zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1.5); scheduleCull();
});
zoomOut.addEventListener('click', function () {
  zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1 / 1.5); scheduleCull();
});
fitBtn.addEventListener('click', function () { fit(); scheduleCull(); });

// resizing (rotation, mobile toolbars) must not reset the user's zoom -
// just keep the view inside the wall bounds
window.addEventListener('resize', function () { clamp(); setTransform(); scheduleCull(); });

/* ---------- go ---------- */
// open centered on the middle of the wall: 75% on desktop, 35% on
// touch/phone viewports where the wall is huge relative to the screen
var openScale = (matchMedia('(pointer: coarse)').matches || stage.clientWidth < 768) ? 0.35 : 0.75;
scale = openScale;
tx = Math.round((stage.clientWidth - wallW * scale) / 2);
ty = Math.round((stage.clientHeight - wallH * scale) / 2);
clamp(); setTransform(); scheduleCull();
if (hint) setTimeout(function () { hint.classList.add('gone'); }, 7000);
/* Keret page chrome: the credit line and the photographer card. This is page
   furniture only - it never touches the wall, the camera or the frames. */
var CHROME = {"credit":{"label":"Powered by","brand":"Keret","url":"https://github.com/krisztianhadi/keret"},"author":{"name":"Keret demo wall","role":"105 public-domain photographs","bio":"Every photograph here is a CC0 or public-domain file from Wikimedia Commons, credited in full below. Each frame shows the capture data the engine read out of the image itself.","links":[{"label":"Credits","href":"https://github.com/krisztianhadi/keret/blob/main/demo/CREDITS.md"},{"label":"Keret","href":"https://github.com/krisztianhadi/keret"}]}};

(function () {
  'use strict';

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null && text !== '') node.textContent = text;
    return node;
  }

  var data = CHROME || {};

  /* bottom left: where this wall came from */
  var credit = document.getElementById('credit');
  if (credit && data.credit && data.credit.url) {
    credit.href = data.credit.url;
    // the two parts are separate elements so the brand can be emphasised; give
    // assistive tech the sentence they form
    credit.setAttribute('aria-label', data.credit.label + ' ' + data.credit.brand);
    credit.appendChild(el('span', null, data.credit.label));
    credit.appendChild(el('b', null, data.credit.brand));
    credit.hidden = false;
  }

  /* top right: the photographer, when the wall was given one */
  var author = data.author;
  var button = document.getElementById('authorBtn');
  var card = document.getElementById('authorCard');
  if (!author || !author.name || !button || !card) return;

  var close = el('button', 'author-close', '\u00d7');
  close.type = 'button';
  close.setAttribute('aria-label', 'Close');

  var facts = el('dl', 'author-facts');
  function fact(label, value, href) {
    if (!value) return;
    facts.appendChild(el('dt', null, label));
    var dd = el('dd');
    if (href) {
      var link = el('a', null, value);
      link.href = href;
      dd.appendChild(link);
    } else {
      dd.textContent = value;
    }
    facts.appendChild(dd);
  }

  fact('Email', author.email, author.email ? 'mailto:' + author.email : '');
  fact('Phone', author.phone, author.phone ? 'tel:' + author.phone.replace(/[^+0-9]/g, '') : '');
  fact('Location', author.location, '');
  for (var i = 0; i < (author.links || []).length; i++) {
    var l = author.links[i];
    if (!l || !l.href) continue;
    fact(l.label || 'Link', String(l.href).replace(/^https?:\/\//, '').replace(/\/$/, ''), l.href);
  }

  card.appendChild(close);
  card.appendChild(el('h2', null, author.name));
  if (author.role) card.appendChild(el('div', 'author-role', author.role));
  if (author.bio) card.appendChild(el('p', 'author-bio', author.bio));
  if (facts.childNodes.length) card.appendChild(facts);

  function openCard() {
    card.hidden = false;
    button.setAttribute('aria-expanded', 'true');
    close.focus();
  }
  function closeCard() {
    card.hidden = true;
    button.setAttribute('aria-expanded', 'false');
  }

  button.hidden = false;
  button.addEventListener('click', function (e) {
    e.stopPropagation();
    if (card.hidden) openCard(); else closeCard();
  });
  close.addEventListener('click', closeCard);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !card.hidden) closeCard();
  });
  document.addEventListener('click', function (e) {
    if (card.hidden) return;
    if (card.contains(e.target) || button.contains(e.target)) return;
    closeCard();
  });
})();

</script>
</body>
